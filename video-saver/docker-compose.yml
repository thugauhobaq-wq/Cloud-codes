services:
  vsaver:
    build: .
    restart: unless-stopped
    ports:
      # Наружу — только через обратный прокси с HTTPS (см. docker-compose.https.yml).
      # Пока пробуете локально, оставьте как есть и открывайте http://IP:8080
      - "8080:8080"
    volumes:
      - ./data:/data
    command:
      - serve
      - --host=0.0.0.0
      - --port=8080
      - --data=/data

      # Одновременных закачек. Больше — быстрее очередь, но канал сервера один
      # на всех, и на слабом VPS три закачки идут не быстрее двух.
      - --workers=2

      # --- Лимиты. Ради них всё и затевалось: сайт открытый, и без потолков
      # диск с трафиком кончаются за пару дней. Ослабляйте по одному.

      # Сколько задач один адрес может поставить за час.
      - --per-hour=10
      # Сколько его задач может качаться одновременно.
      - --per-ip-active=2
      # Общая длина очереди: дальше сервис честно говорит, что занят.
      - --queue-length=40
      # Потолок размера файла, ГБ.
      - --max-size=2
      # Потолок длительности ролика, минуты.
      - --max-duration=180
      # Сколько места на диске сервис готов занять под скачанное, ГБ.
      # Ставьте заметно меньше размера диска: рядом живут база и система.
      - --disk-quota=40
      # Через сколько часов готовый файл удаляется с сервера.
      - --keep-hours=4

      # Включите, когда поставите впереди Caddy или nginx: тогда лимит частоты
      # считается по настоящему адресу посетителя, а не по адресу прокси.
      # Без прокси включать нельзя — заголовок подделывается одной строкой.
      # - --behind-proxy
