[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botfactory"
version = "0.1.0"
description = "Telegram-бот, который собирает других ботов и пушит их в GitHub"
readme = "README.md"
requires-python = ">=3.11"
# botkit не опубликован в PyPI и ставится из соседнего каталога:
#     pip install -e ../botkit
dependencies = [
    "aiogram>=3.4,<4",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
botfactory = "botfactory.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/botfactory"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — интерфейс русскоязычный
    "RUF002",
    "RUF003",
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
