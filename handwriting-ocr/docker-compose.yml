services:
  hwocr:
    build: .
    restart: unless-stopped
    # Ключи движков берутся из .env рядом с этим файлом (см. .env.example).
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    command:
      - serve
      - --host=0.0.0.0
      - --port=8080
      - --data=/data
      # Предел размера одного фото, МБ. Телефон сжимает снимки сам, 15 хватает
      # с запасом даже для оригиналов через «Поделиться».
      - --max-upload=15
      # Через сколько часов фото и текст удаляются с сервера, и сколько
      # последних результатов хранить всегда, даже если они старше.
      - --keep-hours=24
      - --keep-count=200
