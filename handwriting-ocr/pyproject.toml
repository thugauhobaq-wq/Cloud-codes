[project]
name = "handwriting-ocr"
version = "1.0.0"
description = "Приложение для телефона: фото рукописи → печатный текст"
readme = "README.md"
requires-python = ">=3.11"
# Зависимостей у приложения нет: сервер, очередь, хранилище — стандартная
# библиотека. Единственное исключение — клиент Anthropic, и он необязателен:
# для движка Яндекса хватает urllib.
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1,<2"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
hwocr = "hwocr.cli:main"

[tool.setuptools.packages.find]
include = ["hwocr*"]

[tool.setuptools.package-data]
hwocr = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — интерфейс русскоязычный
    "RUF002",
    "RUF003",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path в conftest настраивается до импортов пакета

[tool.pytest.ini_options]
testpaths = ["tests"]
