[project]
name = "pdf-translator"
version = "1.0.0"
description = "Приложение для телефона: перевод больших PDF с сохранением вёрстки"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
pdftr = "pdftr.cli:main"

[tool.setuptools.packages.find]
include = ["pdftr*"]

[tool.setuptools.package-data]
pdftr = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — интерфейс русскоязычный
    "RUF002",
    "RUF003",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path в conftest настраивается до импортов пакета
"pdftr/pdf/embed.py" = ["C4"]  # модуль перенесён из proposal-generator как есть

[tool.pytest.ini_options]
testpaths = ["tests"]
