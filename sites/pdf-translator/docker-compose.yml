services:
  pdftr:
    build:
      context: .
      # Поставить иероглифические шрифты: нужно, если переводите на японский,
      # китайский или корейский. Плюс около ста мегабайт к образу.
      args:
        CJK: "0"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    command:
      - serve
      - --host=0.0.0.0
      - --port=8080
      - --data=/data
      # Потоков перевода и запросов в секунду. Больше — быстрее, но выше
      # вероятность нарваться на ограничение частоты у переводчика.
      - --workers=4
      - --rate=4
      - --max-upload=300
