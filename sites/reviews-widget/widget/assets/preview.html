<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Превью виджета</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #f5f6f8;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  /* Превью должно врать не больше, чем реальность: если владелец выбрал
     тёмную тему, страница под виджетом тоже показывается тёмной. */
  body[data-theme="dark"] { background: #0e1015; }
  @media (prefers-color-scheme: dark) {
    body[data-theme="auto"] { background: #0e1015; }
  }
</style>
</head>
<body data-theme="__RW_THEME__">
<!-- Ровно та строчка, которую получает клиент; ?preview=1 только отключает кеш. -->
<script src="/w/__RW_SITE_KEY__.js?preview=1" async></script>
</body>
</html>
