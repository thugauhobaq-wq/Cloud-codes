# nginx перед виджетом: HTTPS и кеш статики.
#
# Виджет грузится на чужих сайтах, поэтому HTTPS обязателен: страница по https
# не станет подключать скрипт по http. Сертификат проще всего получить certbot:
#
#   certbot --nginx -d widgets.example.ru
#
# Положите файл в /etc/nginx/sites-available/reviews-widget, замените домен и
# включите: ln -s ../sites-available/reviews-widget /etc/nginx/sites-enabled/

upstream reviews_widget {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Отдачу скрипта и данных имеет смысл кешировать самому nginx: сервер на
# stdlib держит порядка полутора сотен запросов в секунду, а закешированную
# строчку кода nginx отдаёт на порядки быстрее.
proxy_cache_path /var/cache/nginx/reviews-widget levels=1:2
                 keys_zone=widget_cache:10m max_size=256m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name widgets.example.ru;
    # Единственное, что нужно по http — редирект и проверка certbot.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name widgets.example.ru;

    ssl_certificate     /etc/letsencrypt/live/widgets.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widgets.example.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Отзывы присылают люди — тексты длинные, но не безразмерные.
    client_max_body_size 128k;
    gzip on;
    gzip_types application/javascript application/json text/css text/html;
    gzip_min_length 512;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    # Без этого заголовка антифлуд по IP считал бы всех одним посетителем —
    # адресом самого nginx.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Сама строчка кода: меняется редко, запрашивается на каждой загрузке
    # страницы клиента.
    location ~ ^/(embed\.js|w/[^/]+\.js)$ {
        proxy_pass http://reviews_widget;
        proxy_cache widget_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        # Пока обновляется кеш, посетители получают предыдущую версию, а не
        # ждут ответа сервера.
        proxy_cache_use_stale updating error timeout;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Данные виджета: кешируются на минуту, поэтому правки модерации доезжают
    # почти сразу, а всплеск трафика в сервер не проходит.
    location = /api/v1/widget {
        proxy_pass http://reviews_widget;
        proxy_cache widget_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Приём отзывов не кешируем никогда и придерживаем частые отправки: у
    # сервера свой антифлуд, но до питона такие запросы лучше не доводить.
    location = /api/v1/reviews {
        limit_req zone=widget_submit burst=5 nodelay;
        proxy_pass http://reviews_widget;
    }

    # Кабинет модерации: закрыт токеном, но кеш здесь недопустим.
    location /api/admin/ {
        proxy_pass http://reviews_widget;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://reviews_widget;
    }
}

# Зона лимита объявляется на уровне http — вынесите строку в nginx.conf либо
# в отдельный файл в conf.d, здесь она для наглядности:
# limit_req_zone $binary_remote_addr zone=widget_submit:10m rate=30r/m;
