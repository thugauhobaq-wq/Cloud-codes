name: Repo admin

# Управление репозиториями аккаунта из чата Claude Code.
# Claude запускает этот workflow через workflow_dispatch и передаёт,
# что сделать с каким репозиторием. Работает только с репозиториями
# того же владельца, что и этот репозиторий.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Имя репозитория без владельца, например reviews-widget'
        required: true
        type: string
      action:
        description: 'Что сделать'
        required: true
        type: choice
        options:
          - private      # скрыть: пропадёт из профиля и поиска
          - public       # вернуть в публичные
          - archive      # заморозить: read-only, плашка "archived"
          - unarchive    # разморозить
          - transfer     # отправить другому владельцу
          - delete       # удалить безвозвратно
      new_owner:
        description: 'Новый владелец — только для transfer'
        required: false
        type: string
      confirm:
        description: 'Для transfer и delete — впиши имя репозитория ещё раз'
        required: false
        type: string

# Токен берём из секрета: штатный GITHUB_TOKEN таких прав не выдаёт
permissions: {}

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Выполнить действие
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          CONTROL_REPO: ${{ github.event.repository.name }}
          REPO: ${{ inputs.repo }}
          ACTION: ${{ inputs.action }}
          NEW_OWNER: ${{ inputs.new_owner }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Секрет REPO_ADMIN_TOKEN не задан. Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

          case "$REPO" in
            "" | */* )
              echo "::error::Укажи только имя репозитория, без владельца. Получено: '$REPO'"
              exit 1
              ;;
          esac

          FULL="$OWNER/$REPO"

          # Защита от того, чтобы workflow снёс сам себя
          if [ "$REPO" = "$CONTROL_REPO" ]; then
            case "$ACTION" in
              archive | delete | transfer )
                echo "::error::'$ACTION' для $FULL отключено: здесь живёт сам workflow, после такого запускать его будет неоткуда. Сделай это вручную через Settings."
                exit 1
                ;;
            esac
          fi

          # Подтверждение для необратимых действий
          case "$ACTION" in
            delete | transfer )
              if [ "$CONFIRM" != "$REPO" ]; then
                echo "::error::Для '$ACTION' поле confirm должно точно повторять имя репозитория."
                exit 1
              fi
              ;;
          esac

          if ! gh api "repos/$FULL" --jq '.full_name' > /dev/null 2>&1; then
            echo "::error::Репозиторий $FULL не найден или у токена нет к нему доступа."
            exit 1
          fi

          BEFORE=$(gh api "repos/$FULL" --jq '"visibility=\(.visibility) archived=\(.archived)"')
          echo "Было: $BEFORE"

          case "$ACTION" in
            private | public )
              gh api -X PATCH "repos/$FULL" -f visibility="$ACTION" --silent
              ;;
            archive )
              gh api -X PATCH "repos/$FULL" -F archived=true --silent
              ;;
            unarchive )
              gh api -X PATCH "repos/$FULL" -F archived=false --silent
              ;;
            transfer )
              if [ -z "${NEW_OWNER:-}" ]; then
                echo "::error::Для transfer нужен new_owner."
                exit 1
              fi
              gh api -X POST "repos/$FULL/transfer" -f new_owner="$NEW_OWNER" --silent
              ;;
            delete )
              gh api -X DELETE "repos/$FULL" --silent
              ;;
            * )
              echo "::error::Неизвестное действие: $ACTION"
              exit 1
              ;;
          esac

          {
            echo "### Repo admin"
            echo ""
            echo "- Репозиторий: \`$FULL\`"
            echo "- Действие: \`$ACTION\`"
            if [ "$ACTION" = "transfer" ]; then
              echo "- Новый владелец: \`$NEW_OWNER\`"
            fi
            echo "- Было: \`$BEFORE\`"
            if [ "$ACTION" = "delete" ] || [ "$ACTION" = "transfer" ]; then
              echo "- Стало: репозиторий больше не принадлежит \`$OWNER\`"
            else
              echo "- Стало: \`$(gh api "repos/$FULL" --jq '"visibility=\(.visibility) archived=\(.archived)"')\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Готово."
