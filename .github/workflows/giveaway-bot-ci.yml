name: giveaway-bot CI

on:
  push:
    paths:
      - 'giveaway-bot/**'
      - 'botkit/**'
      - '.github/workflows/giveaway-bot-ci.yml'
  pull_request:
    paths:
      - 'giveaway-bot/**'
      - 'botkit/**'
      - '.github/workflows/giveaway-bot-ci.yml'

defaults:
  run:
    working-directory: giveaway-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: giveaway-bot/pyproject.toml

      - name: Установить зависимости
        # botkit не опубликован в PyPI и ставится из соседнего каталога.
        run: |
          pip install -e ../botkit
          pip install -e ".[dev]"

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        run: pytest -q

      - name: Проверить консольные команды
        # Пустая база: команды должны отвечать по-человечески, а не падать.
        run: |
          python -m giveaway giveaways
          # Проверять нечего — ненулевой код возврата, а не трейсбек.
          if python -m giveaway verify 1; then exit 1; fi
        env:
          BOT_TOKEN: ci-not-a-real-token
          OWNER_ID: '1'
          DB_PATH: /tmp/ci-giveaway.db
