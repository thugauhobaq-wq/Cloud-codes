name: botkit CI

on:
  push:
    paths:
      - 'botkit/**'
      - '.github/workflows/botkit-ci.yml'
  pull_request:
    paths:
      - 'botkit/**'
      - '.github/workflows/botkit-ci.yml'

defaults:
  run:
    working-directory: botkit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: botkit/pyproject.toml

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        # Ни сети, ни Telegram: временная база SQLite и подставные отправители.
        run: pytest -q

      - name: Проверить сгенерированный проект
        # Шаблон должен давать проект, который проходит собственный линтер
        # и тесты — иначе каждый новый бот начинается с починки заготовки.
        run: |
          python -m botkit new demo --dir /tmp --title "Демо"
          cd /tmp/demo-bot
          pip install -e ".[dev]"
          ruff check src tests
          pytest -q
          python -m demo stats 7
        env:
          DB_PATH: /tmp/ci-demo.db

      - name: Проверить автономный проект
        # Так его получает покупатель: репозиторий один, botkit рядом не
        # лежит. Ставим в чистое окружение — иначе сборка у заказчика падает,
        # а у автора всё работает.
        run: |
          python -m botkit new solo --dir /tmp --standalone --title "Автономный"
          cd /tmp/solo-bot
          python -m venv .venv
          .venv/bin/pip install --quiet ./vendor/botkit
          .venv/bin/pip install --quiet ".[dev]"
          .venv/bin/python -m pytest -q
          .venv/bin/python -m solo stats 7
        env:
          DB_PATH: /tmp/ci-solo.db
