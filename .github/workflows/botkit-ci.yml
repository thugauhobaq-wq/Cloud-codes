name: botkit CI

on:
  push:
    paths:
      - 'bots/botkit/**'
      - '.github/workflows/botkit-ci.yml'
  pull_request:
    paths:
      - 'bots/botkit/**'
      - '.github/workflows/botkit-ci.yml'

defaults:
  run:
    working-directory: bots/botkit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bots/botkit/pyproject.toml

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        # Ни сети, ни Telegram: временная база SQLite и подставные отправители.
        run: pytest -q

      - name: Проверить сгенерированный проект
        # Шаблон должен давать проект, который проходит собственный линтер
        # и тесты — иначе каждый новый бот начинается с починки заготовки.
        run: |
          python -m botkit new demo --dir /tmp --title "Демо"
          cd /tmp/demo-bot
          pip install -e ".[dev]"
          ruff check src tests
          pytest -q
          python -m demo stats 7
        env:
          DB_PATH: /tmp/ci-demo.db
